<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Cinema</title>
    <link rel="stylesheet" href="static/style.css?v=0.3.0">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div>
                <h1>Stream Cinema</h1>
                <p>Katalog filmů, seriálů a streamů</p>
            </div>
            <form class="search-box" id="searchForm" action="api/search" method="get">
                <input type="text" id="searchInput" name="q" placeholder="Hledat film nebo seriál">
                <select id="searchType" name="media_type">
                    <option value="movie">Film</option>
                    <option value="tvshow">Seriál</option>
                </select>
                <button type="submit" id="searchButton" onclick="window.streamCinemaSearch && window.streamCinemaSearch(event)">Hledat</button>
            </form>
        </header>

        <section id="status" class="status hidden"></section>

        <nav class="tabs">
            <button type="button" class="tab-button active" data-tab="searchTab">Hledání</button>
            <button type="button" class="tab-button" data-tab="collectionTab">Sbírka</button>
        </nav>

        <section id="searchTab" class="tab-page active">
            <section id="searchPanel" class="search-panel">
                <div class="empty-state">
                    Zadej název, vyber film nebo seriál a spusť hledání.
                </div>
            </section>
        </section>

        <section id="collectionTab" class="tab-page">
            <main class="workspace">
                <aside class="catalog">
                    <div class="catalog-toolbar">
                        <h2>Sbírka</h2>
                        <select id="typeFilter">
                            <option value="all">Vše</option>
                            <option value="movie">Filmy</option>
                            <option value="tvshow">Seriály</option>
                        </select>
                    </div>
                    <input class="catalog-filter" id="catalogFilter" placeholder="Filtrovat sbírku">
                    <div id="catalogList" class="catalog-list"></div>
                </aside>

                <section id="detailPanel" class="detail-panel">
                    <div class="empty-state">
                        Vyber položku ze sbírky.
                    </div>
                </section>
            </main>
        </section>
    </div>

    <script src="static/app.js?v=0.3.0"></script>
</body>
</html>
